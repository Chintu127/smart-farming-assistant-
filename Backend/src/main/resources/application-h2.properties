spring.application.name=SmartFarm

spring.datasource.url=jdbc:h2:file:./data/smartfarm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=zrZVW9sPBIhqnGdsHB3YKMb9QgwGElAgV6xqRIM6egM=
jwt.expiration=86400000

openweathermap.api.key=${OPENWEATHERMAP_API_KEY:your_openweathermap_api_key}

