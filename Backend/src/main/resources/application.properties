spring.application.name=SmartFarm

# ===================================================================
# Database Configuration
# Embedded H2 Database (persisted in ./data/smartfarm)
# AUTO_SERVER=TRUE allows multiple processes / terminal instances to share DB
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/smartfarm;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Uncomment below lines to switch to local MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/smartAgriculture?createDatabaseIfNotExist=true&useSSL=false
# spring.datasource.username=root
# spring.datasource.password=Root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT
jwt.secret=zrZVW9sPBIhqnGdsHB3YKMb9QgwGElAgV6xqRIM6egM=
jwt.expiration=86400000

# Third-party APIs
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:your_openweathermap_api_key}
opencage.api.key=${OPENCAGE_API_KEY:your_opencage_api_key}
